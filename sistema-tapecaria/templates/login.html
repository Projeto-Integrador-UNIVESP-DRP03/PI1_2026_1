<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Zito Tapeçaria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { font-family: 'Manrope', system-ui, sans-serif; background: #0b1220; }
        .title-font { font-family: 'Barlow Condensed', 'Manrope', system-ui, sans-serif; letter-spacing: 0.06em; }
        .glass { background: #ffffff; border: 1px solid #e2e8f0; }
        .login-intro { color: #cbd5e1; }
        .login-intro h1 { color: #ffffff; }
        .login-features { color: #cbd5e1; }
        .login-features i { color: #34d399; }
        .login-card h2 { color: #1f2937; }
        .input-icon { position: relative; display: block; }
        .input-icon i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .input-icon input { width: 100%; padding: 0.85rem 1rem 0.85rem 2.75rem; border: 1px solid #e2e8f0; border-radius: 1rem; transition: all 0.2s; background: #f8fafc; }
        .input-icon input::placeholder { color: #64748b; }
        .input-icon input:focus { outline: none; border-color: #e11d2e; box-shadow: 0 0 0 4px rgba(225,29,46,0.12); background: #ffffff; }
        .btn-login { color: #ffffff; background-color: #7f1d1d; transition: all 0.2s; }
        .btn-login:hover { background-color: #681818; transform: translateY(-2px); box-shadow: 0 12px 24px -8px rgba(225, 29, 46, 0.55); }
        .login-logo { width: auto; height: 100px; }
        .shake { animation: shake 0.25s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        @media (max-width: 640px) {
            body { padding: 1rem; overflow-x: hidden; overflow-y: auto; align-items: flex-start; }
            .login-layout { min-height: calc(100svh - 2rem); align-content: center; }
            .login-card { width: 100%; max-width: 26rem; justify-self: center; }
            .glass { padding: 1.5rem; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative overflow-x-hidden">
    <div class="floaty one" aria-hidden="true"></div>
    <div class="floaty two" aria-hidden="true"></div>
    <div class="floaty three" aria-hidden="true"></div>

    <main class="login-layout w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-8 relative z-10">
        <section class="login-intro flex flex-col justify-center px-4" aria-labelledby="page-heading">
            <div class="mb-6">
                <h1 id="page-heading" class="title-font text-5xl lg:text-6xl font-bold mt-4">Gestão de pedidos e serviços</h1>
            </div>
            <div class="login-features flex gap-3 text-sm">
                <div class="flex items-center gap-2"><i class="fas fa-check-circle" aria-hidden="true"></i> Gerenciamento de prazos</div>
                <div class="flex items-center gap-2"><i class="fas fa-check-circle" aria-hidden="true"></i> Controle por indicadores</div>
            </div>
        </section>

        <section class="glass login-card rounded-3xl p-10 shadow-2xl" aria-labelledby="login-heading">
            <div class="text-center mb-8">
                <div class="mb-6 flex justify-center" style="height: 100px;">
                    <img src="{{ url_for('static', filename='imagens/Identidade_visual/logo_aplicacao.png') }}" alt="logo_aplicacao" class="login-logo">
                </div>
                <h2 id="login-heading" class="text-2xl font-bold">Acesso ao sistema</h2>
            </div>
            <form id="loginForm" class="space-y-4" method="POST" action="{{ url_for('main.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <label class="input-icon">
                    <span class="sr-only">Usuário</span>
                    <i class="fas fa-user" aria-hidden="true"></i>
                    <input type="text" id="usuario" name="username" placeholder="Usuário" required autocomplete="username">
                </label>
                <label class="input-icon">
                    <span class="sr-only">Senha</span>
                    <i class="fas fa-lock" aria-hidden="true"></i>
                    <input type="password" id="senha" name="password" placeholder="Senha" required autocomplete="current-password">
                </label>
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for categoria, mensagem in messages %}
                        <div class="text-sm text-red-600" role="alert">{{ mensagem }}</div>
                    {% endfor %}
                {% endwith %}
                <button type="submit" class="btn-login w-full font-semibold py-3 rounded-xl flex items-center justify-center gap-2 transition">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </form>
        </section>
    </main>

</body>
</html>
